<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    Monochrome status-bar badge for Android notifications.
    Android only uses the ALPHA MASK (the shape) and tints it white, so the
    background MUST be transparent and only the 日 kanji opaque. A filled
    background would show up as a solid white square (the bug we're fixing).
  -->
  <text x="48" y="74" text-anchor="middle" font-family="sans-serif"
        font-size="80" font-weight="bold" fill="#ffffff">日</text>
</svg>
